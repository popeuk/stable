<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FCFBF9">
<meta name="robots" content="noindex">
<title>Essai barre iPhone</title>
<!-- Essai du 31 octobre 2026 : quelle forme d'en-tête fait que Safari iOS 26 garde la zone de l'heure et du réseau pleine ?
     Chaque variante se choisit par ?v=1 à ?v=5. Page de préprod seulement, sans lien depuis l'app. -->
<style>
  html, body { margin: 0; background: #FCFBF9; font: 16px/1.4 system-ui, sans-serif; color: #1D1A1F; }
  .hd { top: 0; left: 0; right: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: calc(env(safe-area-inset-top) + 8px) 16px 0; background: #FCFBF9; border-bottom: 1px solid #E6E1E8; box-sizing: border-box; }
  .hd b { font-size: 22px; letter-spacing: -.03em; }
  .hd span { font-size: 13px; color: #6B6470; }
  .colle .hd { position: sticky; }
  .fixe .hd { position: fixed; }
  .fixe main { padding-top: calc(env(safe-area-inset-top) + 61px); }
  .badge { position: fixed; left: 50%; top: 2px; transform: translateX(-50%); z-index: 9999; padding: 4px 9px; border-radius: 8px; background: #FBF1D6; color: #5C4210; font: 700 10px/1.3 system-ui, sans-serif; pointer-events: none; }
  .fond { position: fixed; top: 0; left: 0; right: 0; height: calc(env(safe-area-inset-top) + 52px); background: #FCFBF9; z-index: 29; }
  .fond.sans-toucher { pointer-events: none; }
  main { padding: 0 16px 120px; }
  .bloc { height: 220px; border-radius: 12px; margin: 16px 0; display: flex; align-items: flex-end; padding: 16px; box-sizing: border-box; color: #fff; font-size: 28px; font-weight: 800; }
  .b1 { background: #0B3325; } .b2 { background: #D9467A; } .b3 { background: #2F6FB3; } .b4 { background: #E3A21A; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
  nav a { padding: 10px 14px; border-radius: 10px; background: #F4F1F5; color: #1D1A1F; text-decoration: none; font-weight: 700; }
  nav a.on { background: #0B3325; color: #fff; }
  p.k { color: #6B6470; font-size: 14px; }
</style>
</head>
<body>
<script>
  // Les cinq variantes : ce qui est en haut de l'écran.
  var V = {
    1: { nom: "En-tête collant seul", classe: "colle" },
    2: { nom: "Collant + badge fixe au centre (préprod d'avant)", classe: "colle", badge: true },
    3: { nom: "Collant + fond fixe qui ignore le toucher", classe: "colle", fond: "sans-toucher" },
    4: { nom: "Collant + fond fixe qui reçoit le toucher (correction)", classe: "colle", fond: "toucher" },
    5: { nom: "En-tête fixe", classe: "fixe" }
  };
  var n = Number(new URLSearchParams(location.search).get("v")) || 4;
  var v = V[n] || V[4];
  document.body.className = v.classe;
  if (v.fond) { var f = document.createElement("div"); f.className = "fond" + (v.fond === "sans-toucher" ? " sans-toucher" : ""); document.body.appendChild(f); }
  if (v.badge) { var b = document.createElement("div"); b.className = "badge"; b.textContent = "Préproduction · données de test"; document.body.appendChild(b); }
  document.write('<header class="hd"><b>be stable</b><span>Variante ' + n + '</span></header>');
  var liens = Object.keys(V).map(function (k) { return '<a href="?v=' + k + '"' + (Number(k) === n ? ' class="on"' : "") + ">" + k + "</a>"; }).join("");
  document.write('<main><h1 style="font-size:24px;margin:20px 0 4px">Variante ' + n + "</h1><p class=\"k\">" + v.nom + "</p><nav>" + liens + "</nav>" +
    "<p>Fais défiler vers le bas. Regarde la zone de l’heure et du réseau : reste-t-elle crème, ou voit-on les blocs de couleur passer dessous ?</p>" +
    '<div class="bloc b1">1</div><div class="bloc b2">2</div><div class="bloc b3">3</div><div class="bloc b4">4</div><div class="bloc b1">5</div><div class="bloc b2">6</div></main>');
</script>
</body>
</html>

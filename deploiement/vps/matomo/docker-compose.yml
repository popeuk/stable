# Matomo de Be Stable (19 octobre 2026) : mesure sans cookie de l app.
# Port local seulement, Caddy sert stats.bestable.fr. Mots de passe dans .env (600).
services:
  db:
    image: mariadb:11.8.9
    container_name: matomo-db
    restart: unless-stopped
    command: --max-allowed-packet=64MB
    env_file: .env
    environment:
      MARIADB_DATABASE: matomo
      MARIADB_USER: matomo
    volumes:
      - ./db:/var/lib/mysql
  app:
    image: matomo:5.14.0-apache
    container_name: matomo
    restart: unless-stopped
    depends_on: [db]
    env_file: .env
    environment:
      MATOMO_DATABASE_HOST: db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_USERNAME: matomo
      MATOMO_DATABASE_DBNAME: matomo
      PHP_MEMORY_LIMIT: 512M
    volumes:
      - ./matomo:/var/www/html
    ports:
      - "127.0.0.1:3020:80"

name: Deploy prototype to GitHub Pages

on:
  push:
    branches: ["claude/be-stable-v2-spec-k62ji2"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build static export (previous app, served under /stable/v1)
        run: npm run build
        env:
          DEPLOY_TARGET: pages
          PAGES_BASE: /stable/v1
          NEXT_PUBLIC_BASE_PATH: /stable/v1
      - name: Assemble site (prototype at the root, previous app in v1/)
        run: |
          mkdir -p site
          cp -R prototype/. site/
          mv out site/v1
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

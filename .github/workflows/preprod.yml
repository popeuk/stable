# La préproduction de l'app (27 octobre 2026). Un envoi sur la branche
# « preprod » construit l'app pour preprod-app.187-7-74-179.sslip.io, branchée
# sur la préprod du site (WP Tiger), copie en ligne éteinte, sans mesure
# d'audience. Le résultat part sur la branche « vps-preprod », que le VPS relit
# toutes les 2 minutes (bestable-preprod-maj). La production n'est jamais touchée.
name: Préproduction de l'app (VPS)

on:
  push:
    branches: ["preprod"]

concurrency:
  group: preprod
  cancel-in-progress: true

jobs:
  preprod:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Check (types, lint, tests)
        run: npm run typecheck && npm run lint && npm test
      - name: Build static export (préproduction)
        run: npm run build
        env:
          DEPLOY_TARGET: pages
          PAGES_BASE: ""
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_VERSION: ${{ github.sha }}
          NEXT_PUBLIC_VERSION_DATE: ${{ github.event.head_commit.timestamp }}
          NEXT_PUBLIC_PREPROD: "1"
          NEXT_PUBLIC_MONECURIE_API: https://f8a2-d405641a5d0e.wptiger.fr/wp-json/bestable/v1
          # La copie en ligne de préprod (28 novembre 2026) : sa propre fonction et ses propres tables, jamais les tiroirs réels.
          NEXT_PUBLIC_NUAGE_URL: https://wgvithqivsygsoeyqruz.supabase.co/functions/v1/tiroirs-preprod
          # Le canal de l'écurie (Realtime) : la clé publique du projet, faite pour être dans l'app.
          NEXT_PUBLIC_SUPABASE_AUTH_URL: https://wgvithqivsygsoeyqruz.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_e6R9yC-WtMe39sWuIWPKRw_vudSuE0o
          NEXT_PUBLIC_SITES_API: https://sites.187-7-74-179.sslip.io
          # Mon site visible en préprod (5 novembre 2026), toujours masqué en production.
          NEXT_PUBLIC_PAYANT: "1"
          # Les quatre parties (26 novembre 2026) : Accueil, Te trouver, Te choisir, Te faire vivre. Préprod seulement.
          NEXT_PUBLIC_QUATRE: "1"
          # Tout débloqué en préprod (27 novembre 2026, décision de Samuel) : la partie argent visible, plus de cadenas.
          NEXT_PUBLIC_ARGENT: "1"
          # L'audit en ligne (27 novembre 2026) : le service du VPS (deploiement/vps/audit), préprod seulement.
          NEXT_PUBLIC_AUDIT_API: https://audit.187-7-74-179.sslip.io
      - name: Publish to the vps-preprod branch
        run: |
          cd out
          echo "${{ github.sha }}" > VERSION
          printf 'User-agent: *\nDisallow: /\n' > robots.txt
          git init -q -b vps-preprod
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Préproduction ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" vps-preprod
